INHERIT: zensical-base.yml

site_name: ARHO-käyttöohje
site_description: ARHO-kaavoitustyökalun käyttöohje
site_url: https://gispocoding.github.io/arho-qgis-plugin/
docs_dir: fi
site_dir: site
edit_uri: edit/main/manual/fi/

theme:
  language: fi
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: lucide/moon
        name: Vaihda tummaan tilaan
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: lucide/sun
        name: Vaihda vaaleaan tilaan

nav:
  - index.md
  - about.md
  - qgis.md
  - plugin.md
  - project.md
  - plan-matter.md
  - Kaavasuunnitelma:
      - plan/index.md
      - plan/open.md
      - plan/create.md
      - plan/lock.md
      - plan/export.md
      - plan/import.md
      - plan/edit.md
  - plan-objects.md
  - regulation-groups.md
  - libraries.md
  - validation.md
  - multilingual.md
  - geotiff.md
  - legend.md
  - Elinkaaren vaiheet:
      - lifecycle/index.md
      - lifecycle/preparation.md
      - lifecycle/approved.md
      - lifecycle/in-force.md
      - lifecycle/appeal.md
  - consolidated-plan.md
  - plan-amendment.md
  - ryhti.md
  - Visualisoinnit:
      - styling/index.md
      - styling/default-styles.md
      - styling/rule-based.md
      - styling/symbols-labels.md
      - styling/filters.md
  - api-errors.md
  - digitizing.md
