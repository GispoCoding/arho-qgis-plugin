{% extends "main.html" %}

{#- Home page: a navy-to-violet band above the content.
    Set "template: home.html", "hero_title" and "hero_text" in the page front matter. -#}
{% block hero %}
  <section class="arho-hero">
    <div class="md-grid arho-hero__inner">
      <h1 class="arho-hero__title">{{ page.meta.hero_title }}</h1>
      <p class="arho-hero__text">{{ page.meta.hero_text }}</p>
    </div>
  </section>
{% endblock %}
