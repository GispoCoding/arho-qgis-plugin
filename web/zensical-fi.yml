INHERIT: zensical-base.yml

site_name: ARHO-käyttöohje
site_description: ARHO-kaavoitustyökalun käyttöohje
site_url: https://gispocoding.github.io/arho-qgis-plugin/
docs_dir: fi
site_dir: site
edit_uri: edit/main/web/fi/

theme:
  language: fi
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: lucide/moon
        name: Vaihda tummaan tilaan
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: lucide/sun
        name: Vaihda vaaleaan tilaan

# Three tabs (navigation.tabs): home, about and the manual.
nav:
  - Etusivu: index.md
  - Arhosta: about.md
  - Käyttöohje:
      - manual/index.md
      - manual/setup.md
      - manual/interface.md
      - manual/project.md
      - manual/plan-matter.md
      - Kaavasuunnitelma:
          - manual/plan/index.md
          - manual/plan/open.md
          - manual/plan/create.md
          - manual/plan/lock.md
          - manual/plan/export.md
          - manual/plan/import.md
          - manual/plan/edit.md
      - manual/plan-objects.md
      - manual/regulation-groups.md
      - manual/libraries.md
      - manual/validation.md
      - manual/multilingual.md
      - manual/geotiff.md
      - manual/legend.md
      - Elinkaaren vaiheet:
          - manual/lifecycle/index.md
          - manual/lifecycle/preparation.md
          - manual/lifecycle/approved.md
          - manual/lifecycle/in-force.md
          - manual/lifecycle/appeal.md
      - manual/consolidated-plan.md
      - manual/plan-amendment.md
      - manual/ryhti.md
      - Visualisoinnit:
          - manual/styling/index.md
          - manual/styling/default-styles.md
          - manual/styling/rule-based.md
          - manual/styling/symbols-labels.md
          - manual/styling/filters.md
      - manual/api-errors.md
      - manual/digitizing.md
