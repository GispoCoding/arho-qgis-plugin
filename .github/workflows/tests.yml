# workflow name
name: Tests

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the wanted branches
on:
  pull_request:
  push:
    branches: [main]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  linux_tests:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    container:
      image: qgis/qgis:${{ matrix.qgis-image-tags }}
    strategy:
      matrix:
        # Docker Hub tags: "<major.minor>" (for example "3.44", "4.2"), ltr, latest.
        # The old release-3_xx tags stopped being updated in 2024.
        qgis-image-tags: ["3.44", "4.2", latest]
      fail-fast: false

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # The QGIS images do not ship git, so actions/checkout would fall back to
      # the REST API download, which cannot fetch submodules.
      - name: Install git
        run: |
          apt update && apt install git -y

      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Install dependencies
        run: |
          apt update && apt install python3-venv -y
          python3 -m venv --system-site-packages .venv
          .venv/bin/python -m pip install -U setuptools pip
          .venv/bin/pip install -r requirements-test.txt
          .venv/bin/pip install .

      - name: Run tests
        env:
          QGIS_PLUGIN_IN_CI: 1
          QT_QPA_PLATFORM: offscreen
        run: |
          .venv/bin/pytest

  # Runs the suite inside the real QGIS application, where qgis.utils.iface is the real
  # QgisAppInterface instead of the FakeQgisInterface that linux_tests uses. Tests marked
  # `fake_iface` skip themselves here; tests marked `real_qgis` only run here.
  #
  # A separate job pulls the image a second time, which is cheap (under a gigabyte) and
  # runs in parallel. Sharing the pull is not possible: a `container:` job pulls before
  # its first step, so there is nowhere to load a cached image.
  qgis_app_tests:
    name: In QGIS (${{ matrix.qgis-image-tags }})
    runs-on: ubuntu-latest
    container:
      image: qgis/qgis:${{ matrix.qgis-image-tags }}
    strategy:
      matrix:
        qgis-image-tags: ["3.44", "4.2", latest]
      fail-fast: false

    steps:
      # The QGIS images do not ship git, so actions/checkout would fall back to
      # the REST API download, which cannot fetch submodules.
      - name: Install git
        run: |
          apt update && apt install git -y

      - uses: actions/checkout@v6
        with:
          submodules: true

      # The qgis/qgis images ship Xvfb but no supervisord, so start the display here.
      # QT_QPA_PLATFORM must stay unset: the application uses this real X display.
      - name: Start a virtual display
        run: |
          Xvfb :99 -screen 0 1024x768x24 -ac &
          sleep 3

      # No venv and no `pip install .`: the script installs a pinned pytest and symlinks
      # the plugin into the QGIS profile, and the plugin has no runtime dependencies.
      - name: Install pytest, prepare profile and link plugin
        run: bash ci/qgis_docker_setup.sh arho_feature_template

      # ci/qgis_pytest_runner.py exits with the pytest exit code, so this step fails
      # the job on its own.
      - name: Run pytest inside QGIS
        env:
          DISPLAY: ":99"
          QGIS_PLUGIN_IN_CI: 1
          PGTZ: Europe/Helsinki
        run: qgis --nologo --noversioncheck --code ci/qgis_pytest_runner.py

  windows_tests:
    name: Windows (${{ matrix.qgis-package }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # Bumping a version both installs the new QGIS version and
        # invalidates the cache for that matrix leg.
        include:
          - qgis-package: qgis-ltr
            qgis-version: "3.44.13"
          - qgis-package: qgis
            qgis-version: "4.2.1"

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Set up Python
        uses: actions/setup-python@v7

      - name: Cache QGIS installation
        id: cache-qgis
        uses: actions/cache@v4
        with:
          key: ${{ matrix.qgis-package }}-${{ matrix.qgis-version }}-${{ runner.os }}
          path: C:\Program Files\QGIS*

      - name: Install QGIS
        if: steps.cache-qgis.outputs.cache-hit != 'true'
        uses: crazy-max/ghaction-chocolatey@v4
        with:
          args: install ${{ matrix.qgis-package }} -y --version=${{ matrix.qgis-version }}

      - name: Create virtual environment
        shell: pwsh
        run: |
          "1" | python create_qgis_venv.py
          .venv\Scripts\activate
          pip install -r requirements-dev.txt -r requirements-test.txt

      - name: Run tests
        shell: pwsh
        env:
          QGIS_PLUGIN_IN_CI: 1
        run: |
          .venv\Scripts\activate
          pytest -v
