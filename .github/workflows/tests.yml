# workflow name
name: Tests

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the wanted branches
on:
  pull_request:
  push:
    branches: [main]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  linux_tests:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    container:
      image: qgis/qgis:${{ matrix.qgis-image-tags }}
    strategy:
      matrix:
        # Remove unsupported versions and add more versions. Use LTR version in the cov_tests job
        qgis-image-tags: [release-3_28, release-3_34, latest]
      fail-fast: false

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # The QGIS images do not ship git, so actions/checkout would fall back to
      # the REST API download, which cannot fetch submodules.
      - name: Install git
        run: |
          apt update && apt install git -y

      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Install dependencies
        run: |
          apt update && apt install python3-venv -y
          python3 -m venv --system-site-packages .venv
          .venv/bin/python -m pip install -U setuptools pip
          .venv/bin/pip install -r requirements-test.txt
          .venv/bin/pip install .

      - name: Run tests
        env:
          QGIS_PLUGIN_IN_CI: 1
          QT_QPA_PLATFORM: offscreen
        run: |
          .venv/bin/pytest

  windows_tests:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Set up Python
        uses: actions/setup-python@v7

      - name: Choco install qgis
        uses: crazy-max/ghaction-chocolatey@v4
        with:
          args: install qgis-ltr -y
      - name: Create virtual environment
        shell: pwsh
        run: |
          "1" | python create_qgis_venv.py
          .venv\Scripts\activate
          pip install -r requirements-dev.txt -r requirements-test.txt

      - name: Run tests
        shell: pwsh
        run: |
          .venv\Scripts\activate
          pytest -v
