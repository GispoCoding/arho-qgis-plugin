name: Enforce PR labels for release drafter

on:
  pull_request:
    types: [labeled, unlabeled, opened, edited, synchronize]
jobs:
  enforce-label:
    runs-on: ubuntu-latest
    steps:
      - uses: yogevbd/enforce-label-action@2.2.2
        with:
          REQUIRED_LABELS_ANY: "feature,enhancement,fix,bugfix,bug,internal,chore,documentation,skip-changelog"
          REQUIRED_LABELS_ANY_DESCRIPTION: "Select at least one label ['feature', 'enhancement', 'fix', 'bugfix', 'bug', 'internal', 'chore', 'documentation', 'skip-changelog'] for the PR"
