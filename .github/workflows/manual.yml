name: User manual

# Builds the user manual (manual/) and publishes it on GitHub Pages:
# https://gispocoding.github.io/arho-qgis-plugin/ (Finnish) and .../sv/ (Swedish).
# Pull requests only get the build, which fails on warnings (broken links, missing images).
on:
  push:
    branches: [main]
    paths:
      - "manual/**"
      - ".github/workflows/manual.yml"
  pull_request:
    paths:
      - "manual/**"
      - ".github/workflows/manual.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; let a running deployment finish.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('manual-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: manual/requirements.txt

      - name: Install Zensical
        run: pip install -r manual/requirements.txt

      - name: Build the Finnish and the Swedish site
        run: python manual/build.py --strict

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: manual/site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
