# Which side a pull request changes.
plugin:
  - changed-files:
      - any-glob-to-match-file: "plugin/**"

backend:
  - changed-files:
      - any-glob-to-match-file: "backend/**"

# Changelog category from the branch name.
enhancement:
  - head-branch: ["^feature/"]

bug:
  - head-branch: ["^fix/"]

internal:
  - head-branch: ["^chore/"]
